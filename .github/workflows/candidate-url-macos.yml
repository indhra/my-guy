# One-off pre-tag evidence for v0.1.0. This is not the tagged release install.
name: Candidate URL install (macOS)

on:
  push:
    branches:
      - feat/v010-candidate-macos-trial

permissions:
  contents: read

jobs:
  candidate-url-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify exact candidate and live main
        env:
          EXPECTED_SHA: c6edf09de6a9fcd6df80ae7116f0735a5ecb0d7f
        run: |
          python - <<'PY'
          import os
          import subprocess

          expected = os.environ["EXPECTED_SHA"]
          branch = "refs/heads/feat/v010-candidate-macos-trial"
          if os.environ.get("GITHUB_REF") != branch:
              raise SystemExit(f"Unexpected trigger: {os.environ.get('GITHUB_REF')}")
          ancestor = subprocess.check_output(["git", "merge-base", "HEAD", "origin/main"], text=True).strip()
          if ancestor != expected:
              raise SystemExit(f"Candidate does not descend from {expected}: {ancestor}")
          remote = subprocess.check_output(
              ["git", "ls-remote", "https://github.com/indhra/my-guy.git", "refs/heads/main"],
              text=True,
          ).split()[0]
          if remote != expected:
              raise SystemExit(f"Public main drifted: expected {expected}, found {remote}")
          print(f"PRE-TAG candidate; public main and branch base: {expected}", flush=True)
          PY
      - name: Install SHA-pinned public URL and exercise private host roots
        env:
          EXPECTED_SHA: c6edf09de6a9fcd6df80ae7116f0735a5ecb0d7f
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import venv

          SHA = "c6edf09de6a9fcd6df80ae7116f0735a5ecb0d7f"
          URL = "git+https://github.com/indhra/my-guy.git@c6edf09de6a9fcd6df80ae7116f0735a5ecb0d7f"
          SOURCE_URL = "https://github.com/indhra/my-guy.git"
          assert os.environ["EXPECTED_SHA"] == SHA

          def run(args, cwd, env, code=0, data=None):
              result = subprocess.run(args, cwd=cwd, env=env, input=data, text=True, capture_output=True)
              if result.returncode != code:
                  raise RuntimeError(f"{args[:3]}: exit {result.returncode}, expected {code}; "
                                     f"stdout={result.stdout}; stderr={result.stderr}")
              return result.stdout.strip()

          def installed(python, cli, cwd, env):
              probe = (
                  "import importlib.metadata,json,router,sys; from pathlib import Path; "
                  "d=importlib.metadata.distribution('agent-router'); "
                  "assert Path(router.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); "
                  "print(json.dumps({'version':d.version,'direct_url':json.loads(d.read_text('direct_url.json'))}))"
              )
              result = json.loads(run([str(python), "-c", probe], cwd, env))
              assert result["version"] == "0.1.0", result
              assert result["direct_url"] == {
                  "url": SOURCE_URL,
                  "vcs_info": {"vcs": "git", "requested_revision": SHA, "commit_id": SHA},
              }, result
              assert run([str(cli), "--version"], cwd, env) == "my-guy 0.1.0"
              print(f"PASS: {cli} version 0.1.0; PEP 610 public Git URL @{SHA}", flush=True)

          def lifecycle(cli, base, env):
              base.mkdir()
              env = env.copy()
              env["HOME"] = str(base / "home")
              env["XDG_CONFIG_HOME"] = str(base / "home" / ".config")
              env["MY_GUY_HOME"] = str(base / "state")
              Path(env["HOME"]).mkdir()
              Path(env["XDG_CONFIG_HOME"]).mkdir()

              def call(*args, code=0, data=None):
                  return run([str(cli), *args], base, env, code, data)

              doctor = json.loads(call("doctor", code=1))
              assert doctor["status"] == "needs_capabilities" and doctor["trusted_root_count"] == 0, doctor
              call("sync")
              route = json.loads(call("route", "--stdin", "--json", data="Review this request"))
              assert route["status"] == "clarify", route
              roots = {
                  "claude": Path(env["HOME"]) / ".claude" / "skills",
                  "codex": Path(env["HOME"]) / ".codex" / "skills",
                  "opencode": Path(env["XDG_CONFIG_HOME"]) / "opencode" / "skills",
              }
              for host, root in roots.items():
                  target = root / "my-guy"
                  target.mkdir(parents=True)
                  marker = target / "SKILL.md"
                  marker.write_text("unknown pre-existing install\n")
                  refused = subprocess.run(
                      [str(cli), "install", host, "--root", str(root)],
                      cwd=base, env=env, text=True, capture_output=True,
                  )
                  assert refused.returncode != 0, refused
                  assert "explicit --replace-existing approval is required" in refused.stderr, refused
                  assert marker.read_text() == "unknown pre-existing install\n", refused
                  print(f"PASS: {host} refused overwrite of unknown {target}", flush=True)
                  marker.unlink()
                  target.rmdir()

                  call("install", host, "--root", str(root), "--dry-run")
                  assert not target.exists(), host
                  call("install", host, "--root", str(root))
                  assert marker.is_file(), host
                  status = json.loads(call("status", host, "--root", str(root), "--json"))
                  assert (status["state"], status["owned"]) == ("ready", True), status
                  doctor = json.loads(call("doctor", "--harness", host, "--root", str(root), code=1))
                  assert (doctor["status"], doctor["trusted_root_count"], doctor["installation"]["state"]) == ("needs_capabilities", 0, "ready"), doctor
                  call("disable", host, "--root", str(root))
                  status = json.loads(call("status", host, "--root", str(root), "--json", code=1))
                  assert status["state"] == "disabled" and status["owned"], status
                  call("rollback", host, "--root", str(root))
                  assert marker.is_file(), host
                  call("uninstall", host, "--root", str(root))
                  assert not marker.exists(), host
                  status = json.loads(call("status", host, "--root", str(root), "--json", code=1))
                  assert (status["state"], status["owned"]) == ("missing", False), status
                  print(f"PASS: {host} canonical root; dry-run/install/status/doctor/disable/rollback/uninstall", flush=True)

          with tempfile.TemporaryDirectory(prefix="my-guy-candidate-", dir=os.environ["RUNNER_TEMP"]) as tmp:
              work = Path(tmp)
              env = os.environ.copy()
              env.pop("PYTHONPATH", None)
              env["PIPX_HOME"] = str(work / "pipx-home")
              env["PIPX_BIN_DIR"] = str(work / "pipx-bin")
              run([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "pipx"], work, env)
              run([sys.executable, "-m", "pipx", "install", "--python", sys.executable, URL], work, env)
              pipx_python = work / "pipx-home" / "venvs" / "agent-router" / "bin" / "python"
              pipx_cli = work / "pipx-bin" / "my-guy"
              installed(pipx_python, pipx_cli, work, env)
              lifecycle(pipx_cli, work / "pipx-trial", env)

              venv_dir = work / "venv"
              venv.EnvBuilder(with_pip=True).create(venv_dir)
              venv_python = venv_dir / "bin" / "python"
              run([str(venv_python), "-m", "pip", "install", "--disable-pip-version-check", URL], work, env)
              venv_cli = venv_dir / "bin" / "my-guy"
              installed(venv_python, venv_cli, work, env)
              lifecycle(venv_cli, work / "venv-trial", env)

          remote = subprocess.check_output(
              ["git", "ls-remote", SOURCE_URL, "refs/heads/main"], text=True,
          ).split()[0]
          assert remote == SHA, f"Public main drifted during run: {remote}"
          print(f"PASS: pre-tag macOS candidate URL trial for {SHA}; release tag remains untested", flush=True)
          PY
