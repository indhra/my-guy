name: Tagged install validation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact main commit SHA to which annotated v0.1.0 must point"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tagged-install:
    name: ${{ matrix.os }} / Python 3.11 / tagged URL
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out dispatch commit and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify main SHA and annotated tag
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python scripts/verify_tagged_install.py guard
      - name: Install tagged URL with pipx and venv, exercise CLIs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python scripts/verify_tagged_install.py run
