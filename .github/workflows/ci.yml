name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements-ci.txt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and build tools
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Test source
        run: python -m pytest -q
      - name: Check Python syntax
        run: python -m compileall -q router tests
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke test installed wheel outside checkout
        run: bash scripts/smoke_install.sh dist/*.whl
      - name: Smoke test installed source distribution outside checkout
        run: bash scripts/smoke_install.sh dist/*.tar.gz
      - name: Retain tested release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error
