[project]
name = "agent-router"
version = "0.1.0"
description = "Harness-neutral personal router for skills and agents"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "Agent Router contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
my-guy = "router.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
router = ["resources/*.json", "resources/my-guy/SKILL.md"]

[tool.setuptools]
packages = ["router", "router.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
