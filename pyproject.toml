[project]
name = "my-guy"
version = "0.2.0.dev0"
description = "Harness-neutral personal router for skills and agents"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "Agent Router contributors" }]
keywords = ["skills", "agents", "routing", "claude-code", "codex", "opencode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/indhra/my-guy"
Repository = "https://github.com/indhra/my-guy"
Issues = "https://github.com/indhra/my-guy/issues"

[project.scripts]
my-guy = "router.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
router = ["resources/*.json", "resources/my-guy/SKILL.md"]

[tool.setuptools]
packages = ["router", "router.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
